[package]
name = "broker-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "S9.6-008 loopback HTTP server: POST /chat streams the AI SDK UI protocol; GET /chat/{id}/stream resumes (204 when idle)."

[dependencies]
axum = "0.8"
broker = { path = "../broker" }
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
tempfile = "3"
