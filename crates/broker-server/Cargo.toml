[package]
name = "broker-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "S9.6-008 loopback HTTP server: POST /chat streams the AI SDK UI protocol; GET /chat/{id}/stream resumes (204 when idle)."

[dependencies]
axum = "0.8"
broker = { path = "../broker" }
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
# S9.18-001: real provider egress. reqwest (MIT OR Apache-2.0) with
# redirect::Policy::none() — the pinned provider is contacted once, never
# followed; url (MIT OR Apache-2.0) validates the pinned base URL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
url = "2"

[dev-dependencies]
tempfile = "3"
