[workspace]
resolver = "2"
members = ["broker", "machine-profile"]
default-members = ["broker", "machine-profile"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
