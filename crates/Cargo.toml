[workspace]
resolver = "2"
members = ["auth-service", "blender-bridge", "broker", "broker-server", "harness-core", "machine-profile", "planar-core", "project-store"]
default-members = ["auth-service", "blender-bridge", "broker", "broker-server", "harness-core", "machine-profile", "planar-core", "project-store"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
