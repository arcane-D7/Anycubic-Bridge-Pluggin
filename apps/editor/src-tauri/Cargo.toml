[workspace]
resolver = "2"
members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.98"

[package]
name = "editor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "R0 Tauri shell for the Anycubic Bridge editor (apps/editor)."

[lib]
name = "editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = "1"
serde_json = "1"
broker = { path = "../../../crates/broker" }
